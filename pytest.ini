[pytest]
testpaths =
    tests
    layer_2_detection
    layer_3_cis
    layer_4_ai_analysis
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The vendored tuxSOC tree is a historical copy of Layer 1/3 and is not on the
# live pipeline path; collecting it duplicates modules and breaks imports.
norecursedirs =
    .git
    __pycache__
    Frontend
